; Stereo Wall Display - machine config
;
; Rename to STEREO_CONFIG_GODOT.cfg and put it next to the exported game .exe.
; (The rig also checks the STEREO_WALL_CONFIG environment variable and your home folder first.)
; Any missing key falls back to the default shown here.
;
; Room coordinates (meters): origin is the floor under the sweet spot,
; +X = viewer's right, +Y = up, the wall is in front at -Z.

[display]
resolution_width=4800        ; pixels per eye (window is twice as wide)
resolution_height=1620
window_position=Vector2i(0, 0)
swap_eyes=false
stereo_enabled=true          ; false = start in mono (F3 toggles)

[wall]
wall_width=6.047
wall_height=2.042
wall_center_height=1.75      ; wall center above the floor
wall_distance=2.282          ; sweet spot to wall
wall_offset_x=0.0            ; wall center left/right of the sweet spot

[render]
eye_separation=0.063
near_clip=0.05
far_clip=5000.0

[tracking]
tracking_enabled=false       ; F5 toggles at runtime
udp_port=4242                ; OpenTrack "UDP over network" default
smoothing=0.5                ; 0 = raw, closer to 1 = smoother but laggier
timeout_sec=0.5              ; no data this long = return to sweet spot
axis_sign=Vector3(1, 1, 1)   ; flip an axis with -1 if movement is mirrored
scale=0.01                   ; tracker units to meters (OpenTrack sends cm)
camera_pitch=0.0             ; degrees the camera tilts DOWN (negative = tilted up)

[calibration]
tracker_origin=Vector3(0, 0, 0)    ; written by F6 calibrate
sweet_spot=Vector3(0, 1.64, 0)     ; ideal eye position in the room
