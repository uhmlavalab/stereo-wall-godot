; Stereo Wall Display - machine config
;
; Rename to STEREO_CONFIG_GODOT.cfg and put it in C:\StereoWallGodot\
; (~/StereoWallGodot/ on Mac/Linux). That is the only place the rig looks.
; Exported builds use these values. Any missing [wall] or [viewer] key uses the
; rig's Display Wall settings in the Inspector (defaults shown here: LAVA lab's display wall).
;
; Room coordinates (meters): origin is the floor where the viewer stands,
; +X = viewer's right, +Y = up, the display wall is in front at -Z.

[display]
resolution_width=4800        ; pixels per eye (window is twice as wide)
resolution_height=1620
window_position=Vector2i(0, 0)
swap_eyes=false
stereo_enabled=true          ; false = start in mono (F3 toggles)

[wall]
wall_width=6.047
wall_height=2.042
wall_center_height=1.75      ; display wall center above the floor
wall_distance=2.282          ; where the viewer stands to the display wall
wall_offset_x=0.0            ; display wall center right (+) / left (-) of the viewer (0 = centered)

[render]
eye_separation=0.063
near_clip=0.05
far_clip=5000.0

[viewer]
eye_height=1.64              ; floor to the viewer's eyes
